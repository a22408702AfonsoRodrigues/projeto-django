{% extends "portfolio/base.html" %}

{% block content %}
<h2>Apagar Artigo</h2>

<p>Tens a certeza que queres apagar <strong>{{ artigo.titulo }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Apagar</button>
</form>

<a href="{% url 'artigos' %}">Cancelar</a>
{% endblock %}
